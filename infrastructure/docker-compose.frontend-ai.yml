services:
  ai-risk:
    build:
      context: ../ai-risk
    environment:
      FINGUARD_INTERNAL_CREDENTIAL: ${FINGUARD_INTERNAL_CREDENTIAL:?set FINGUARD_INTERNAL_CREDENTIAL in .env}
    expose:
      - "8000"
    mem_limit: ${AI_RISK_MEM_LIMIT:-512m}
    networks: [internal-zone]
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: ../frontend
      args:
        VITE_FINBOUND_API_MODE: real
        VITE_FINBOUND_API_BASE_URL: /core-api
    environment:
      CORE_API_UPSTREAM: ${FRONTEND_CORE_API_UPSTREAM:-http://core-api:8080}
    depends_on:
      core-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8088}:8080"
    networks: [public-zone, internal-zone]
    security_opt: [no-new-privileges:true]
