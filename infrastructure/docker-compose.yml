name: finguard

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - finguard-postgres:/var/lib/postgresql/data
    networks: [finguard]

  opa:
    image: openpolicyagent/opa:1.17.0-static
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policy
    ports:
      - "${OPA_PORT:-8181}:8181"
    volumes:
      - ../policy:/policy:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks: [finguard]

networks:
  finguard:
    driver: bridge

volumes:
  finguard-postgres:
