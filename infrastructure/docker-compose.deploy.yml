# 배포용 오버레이 — 소스에서 빌드하지 않고 GHCR에서 받은 이미지를 실행한다.
#
#   IMAGE_TAG=<commit-sha> docker compose --env-file /opt/finbound/.env \
#     -f docker-compose.yml -f docker-compose.demo.yml \
#     -f docker-compose.frontend-ai.yml -f docker-compose.deploy.yml \
#     pull
#   IMAGE_TAG=<commit-sha> docker compose ... up -d --no-build --wait
#
# 기본 Compose 파일들은 여섯 서비스를 전부 `build:` 로 정의한다. 그대로 두면 배포 대상에서
# Gradle 빌드와 ML 모델 내려받기가 다시 일어난다. 이 파일이 같은 서비스에 `image:` 를 얹어
# `pull` 이 받을 대상을 만든다.
#
# `build:` 를 지우지는 않는다 — Compose 오버레이는 키를 제거하지 못한다. 대신 실행 시
# `--no-build` 를 준다. 그래서 이 오버레이만으로는 부족하고, 위 명령을 그대로 써야 한다.
#
# IMAGE_TAG 에 기본값을 두지 않는다. 값이 없으면 조용히 엉뚱한 것을 띄우는 대신 실패한다.
services:
  core-api:
    image: ghcr.io/finguardname/finbound-core-api:${IMAGE_TAG:?IMAGE_TAG must be set to a commit SHA}
    pull_policy: always

  gateway:
    image: ghcr.io/finguardname/finbound-gateway:${IMAGE_TAG:?IMAGE_TAG must be set to a commit SHA}
    pull_policy: always

  agent:
    image: ghcr.io/finguardname/finbound-agent:${IMAGE_TAG:?IMAGE_TAG must be set to a commit SHA}
    pull_policy: always

  mock-finance:
    image: ghcr.io/finguardname/finbound-mock-finance:${IMAGE_TAG:?IMAGE_TAG must be set to a commit SHA}
    pull_policy: always

  ai-risk:
    image: ghcr.io/finguardname/finbound-ai-risk:${IMAGE_TAG:?IMAGE_TAG must be set to a commit SHA}
    pull_policy: always

  frontend:
    image: ghcr.io/finguardname/finbound-frontend:${IMAGE_TAG:?IMAGE_TAG must be set to a commit SHA}
    pull_policy: always
