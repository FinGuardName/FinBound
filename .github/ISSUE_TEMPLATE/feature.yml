name: Feature Issue
description: P0/P1 기능 구현 작업
title: "[FEAT] "
labels: ["feat"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 이 기능이 필요한 이유를 적어 주세요.
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: 기능/인수 조건 ID
      description: 예) F11, AC-02
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 같은 기능 Branch와 PR에서 완료할 구현·테스트·문서 범위를 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 담당 영역
      options:
        - backend/core-api
        - backend/gateway
        - backend/agent
        - backend/mock-finance
        - backend/audit
        - ai-risk
        - frontend
        - policy
        - infrastructure
        - docs/contracts
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 구현 후 확인할 수 있는 결과와 테스트 조건을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 검증 시나리오
      description: 정상, BLOCK, ERROR 및 downstream 도달 여부를 포함해 주세요.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 담당자
      description: 담당 GitHub ID 또는 역할을 적어 주세요.
    validations:
      required: true
