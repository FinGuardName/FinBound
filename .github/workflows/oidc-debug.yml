# 일회성 진단용. OIDC 토큰이 실제로 주장하는 sub·aud 를 확인한다.
# IAM 신뢰 정책의 조건과 대조하기 위한 것이며, 확인이 끝나면 지운다.
#
# 토큰 자체는 절대 출력하지 않는다 — 그것은 자격증명이다. payload 에서
# sub 와 aud 두 필드만 꺼낸다.
name: OIDC debug

on:
  workflow_dispatch:
  push:
    branches: [chore/aws-iam-policies]

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print sub and aud only
        run: |
          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          printf '%s' "$token" | python3 -c '
import sys, base64, json
payload = sys.stdin.read().split(".")[1]
payload += "=" * (-len(payload) % 4)
claims = json.loads(base64.urlsafe_b64decode(payload))
print("sub =", claims.get("sub"))
print("aud =", claims.get("aud"))
print("iss =", claims.get("iss"))
print("repository =", claims.get("repository"))
'
