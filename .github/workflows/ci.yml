name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # if 조건은 step 자신의 env를 읽지 못하므로 job 레벨에 둔다.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube가 신규 코드를 판정하려면 전체 히스토리가 필요하다.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # check는 test, checkstyle, jacocoTestCoverageVerification(80%),
      # enforceTestPresence를 모두 실행한다.
      - name: Build and verify Spring modules
        run: ./gradlew check --no-daemon
      # SONAR_TOKEN이 없는 fork PR에서는 분석을 건너뛴다.
      - name: SonarQube analyze
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon -Dsonar.projectVersion=${{ github.run_number }}

  ai-risk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-risk/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Lint and verify AI Risk formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test AI Risk API
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Rego policy
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          openpolicyagent/opa:1.17.0-static
          test /workspace/policy -v
